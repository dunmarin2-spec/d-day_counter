<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 디데이 카운터</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column; /* 배너 배치를 위해 컬럼 방향으로 변경 */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
            margin-bottom: 30px; /* 배너와 간격 */
        }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 1.5rem; }
        input[type="date"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            width: 80%;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f0f4f8;
            border-radius: 15px;
        }
        #dday-text {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }
        .desc { color: #666; margin-top: 5px; }
        button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }

        /* 쿠팡 배너 스타일 */
        .coupang-banner {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📅 D-Day Tracker</h1>
    <input type="date" id="target-date">
    <br>
    <button onclick="saveDate()">날짜 저장</button>

    <div class="result">
        <p class="desc" id="event-name">오늘부터 목표일까지</p>
        <h2 id="dday-text">D-?</h2>
    </div>
</div>

<div class="coupang-banner">
    <script src="https://ads-partners.coupang.com/g.js"></script>
    <script>
        new Couples.SearchBanner({
            "trackingCode": "AF4757238",
            "subId": null,
            "width": 300,
            "height": 120
        });
    </script>
</div>

<script>
    const dateInput = document.getElementById('target-date');
    const ddayText = document.getElementById('dday-text');

    window.onload = function() {
        const savedDate = localStorage.getItem('user-dday');
        if (savedDate) {
            dateInput.value = savedDate;
            calculateDDay(savedDate);
        }
    };

    function calculateDDay(targetDate) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        
        const target = new Date(targetDate);
        target.setHours(0, 0, 0, 0);

        const diff = target.getTime() - today.getTime();
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

        if (days === 0) {
            ddayText.innerText = "D-Day";
        } else if (days > 0) {
            ddayText.innerText = `D-${days}`;
        } else {
            ddayText.innerText = `D+${Math.abs(days)}`;
        }
    }

    function saveDate() {
        const val = dateInput.value;
        if (!val) return alert("날짜를 선택해 주세요!");
        
        localStorage.setItem('user-dday', val);
        calculateDDay(val);
    }

    dateInput.addEventListener('change', (e) => {
        calculateDDay(e.target.value);
    });
</script>

</body>
</html>
